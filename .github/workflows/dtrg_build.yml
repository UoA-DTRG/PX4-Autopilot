name: DTRG Build

# Our own CI, independent of the upstream PX4 workflows: build the boards we
# actually fly plus SITL, and publish the firmware as artifacts.
#
# Upstream workflows target 'main' on push and every branch on pull_request.
# This one is scoped to dtrg-main so it runs on our integration branch only.

on:
  push:
    branches:
      - 'dtrg-main'
    paths-ignore:
      - 'docs/**'
      - 'Documentation/**'
      - '**.md'
  pull_request:
    branches:
      - 'dtrg-main'
    paths-ignore:
      - 'docs/**'
      - 'Documentation/**'
      - '**.md'
  workflow_dispatch:

# a new push to the same branch cancels the previous run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nuttx:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    container: px4io/px4-dev-nuttx-focal:2022-08-12
    env:
      # The container ships arm-none-eabi-gcc 9.3.1, which produces roughly 2%
      # larger code than the toolchain we build with locally. On fmu-v6c that is
      # the difference between ~32 kB free and a 9 kB FLASH overflow, so CI has
      # to use the same compiler we flash from rather than the container's.
      ARM_TOOLCHAIN_VERSION: 13.2.rel1
    strategy:
      fail-fast: false
      matrix:
        target:
          - px4_fmu-v5_default
          - px4_fmu-v6c_default
          - px4_fmu-v6xrt_default
          - goosetech_fmu-v6xrt_default
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # the container runs as a different user than the one that checked out
      - name: Git ownership workaround
        run: git config --system --add safe.directory '*'

      - name: Cache Arm GNU Toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: /opt/arm-toolchain
          key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}

      - name: Install Arm GNU Toolchain ${{ env.ARM_TOOLCHAIN_VERSION }}
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          command -v curl >/dev/null || { apt-get update && apt-get install -y curl xz-utils; }
          mkdir -p /opt/arm-toolchain
          curl -fLs "https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel/arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-x86_64-arm-none-eabi.tar.xz" \
            | tar -xJ --strip-components=1 -C /opt/arm-toolchain

      # GITHUB_PATH is prepended, so this shadows the container's 9.3.1
      - name: Use Arm GNU Toolchain
        run: echo "/opt/arm-toolchain/bin" >> $GITHUB_PATH

      - name: Record toolchain version
        run: arm-none-eabi-gcc --version | head -1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ matrix.target }}-ccache-${{ github.run_id }}
          restore-keys: ${{ matrix.target }}-ccache-

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          echo "base_dir = ${GITHUB_WORKSPACE}" > ~/.ccache/ccache.conf
          echo "compression = true" >> ~/.ccache/ccache.conf
          echo "compression_level = 6" >> ~/.ccache/ccache.conf
          echo "max_size = 150M" >> ~/.ccache/ccache.conf
          echo "hash_dir = false" >> ~/.ccache/ccache.conf
          ccache -z

      - name: Build ${{ matrix.target }}
        run: make ${{ matrix.target }}

      - name: ccache statistics
        run: ccache -s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: build/${{ matrix.target }}/${{ matrix.target }}.px4
          if-no-files-found: error

  sitl:
    name: px4_sitl_default
    runs-on: ubuntu-latest
    container: px4io/px4-dev-base-focal:2021-09-08
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git ownership workaround
        run: git config --system --add safe.directory '*'

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: sitl-ccache-${{ github.run_id }}
          restore-keys: sitl-ccache-

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          echo "base_dir = ${GITHUB_WORKSPACE}" > ~/.ccache/ccache.conf
          echo "compression = true" >> ~/.ccache/ccache.conf
          echo "max_size = 150M" >> ~/.ccache/ccache.conf
          echo "hash_dir = false" >> ~/.ccache/ccache.conf
          ccache -z

      - name: Build px4_sitl_default
        run: make px4_sitl_default

      - name: ccache statistics
        run: ccache -s
