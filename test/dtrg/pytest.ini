[pytest]
# DTRG SITL tests: tier 2 (logic on SIH) and tier 3 (flight, marked flight). See README.md.
testpaths = .
markers =
    sih: runs on PX4 SITL with the SIH simulator (every test in this directory)
    flight: tier 3, flies the vehicle and checks how it moved (slow; on the planarOcto)
    fully_actuated: needs an airframe that makes horizontal thrust without tilting (skipped on sihsim_quadx)
addopts = -ra --strict-markers
