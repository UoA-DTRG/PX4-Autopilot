module_name: Multisine Excitation

parameters:
    - group: Multisine Excitation
      definitions:

        DTRG_MSINE_EN:
            description:
                short: Enable multisine excitation module
                long: |
                  When enabled, the module generates orthogonal multisine
                  excitation signals for system identification when triggered.
                  The signals are published for the control allocator to apply.
            type: boolean
            default: 0

        DTRG_MSINE_AMP:
            description:
                short: Excitation amplitude
                long: |
                  Amplitude scaling factor for the multisine excitation signal.
                  The signal is normalized to [-1, 1] then multiplied by this
                  amplitude. Start with small values (0.05-0.1) and increase
                  if needed. Too high values may cause instability.
            type: float
            min: 0.01
            max: 0.5
            default: 0.1
            decimal: 3

        DTRG_MSINE_T:
            description:
                short: Total excitation duration
                long: |
                  Total duration of excitation in seconds.
                  In simultaneous mode (default): All motors are excited for this duration.
                  In sequential mode: This time is divided evenly among motors (T/num_motors per motor).
                  This determines the frequency resolution: f0 = 1/T_per_motor.
                  Longer periods give better low-frequency resolution.
            type: float
            unit: s
            min: 5.0
            max: 120.0
            default: 30.0
            decimal: 1

        DTRG_MSINE_FMIN:
            description:
                short: Minimum excitation frequency
                long: |
                  Minimum frequency of the multisine signal in Hz.
                  Should be chosen based on the expected system dynamics.
                  For multirotor attitude dynamics, 0.1 Hz is typically sufficient.
            type: float
            unit: Hz
            min: 0.01
            max: 5.0
            default: 0.1
            decimal: 2

        DTRG_MSINE_FMAX:
            description:
                short: Maximum excitation frequency
                long: |
                  Maximum frequency of the multisine signal in Hz.
                  Should be chosen based on the expected system bandwidth.
                  For multirotor attitude dynamics, 1-5 Hz covers the relevant range.
            type: float
            unit: Hz
            min: 0.5
            max: 25.0
            default: 1.0
            decimal: 2

        DTRG_MSINE_RC_CH:
            description:
                short: RC channel for trigger
                long: |
                  RC channel (1-18) used to trigger the excitation.
                  Set to 0 to disable RC triggering (use only manual commands).
                  When the RC channel value exceeds 0.5 (1500us), excitation starts.
                  When it drops below 0.5 (1500us), excitation stops.
                  Can use any RC channel including throttle, aux, or switch channels.
            type: int32
            min: 0
            max: 18
            default: 0

        DTRG_MSINE_NMOT:
            description:
                short: Number of motors
                long: |
                  Number of motors to generate excitation signals for.
                  In sequential mode, each motor is excited one at a time.
                  In simultaneous mode, all motors receive orthogonal signals.
                  Must match the actual motor count of the vehicle.
            type: int32
            min: 2
            max: 16
            default: 8

        DTRG_MSINE_SEQ:
            description:
                short: Sequential motor excitation
                long: |
                  When disabled (default), all motors receive their orthogonal
                  excitation signals simultaneously - this is the standard mode
                  for RLS system identification matching the MATLAB implementation.
                  When enabled, motors are excited one at a time which may give
                  cleaner data in some scenarios.
            type: boolean
            default: 0

        DTRG_MSINE_BTHR:
            description:
                short: Bench test baseline throttle
                long: |
                  The baseline throttle value for bench testing mode.
                  This is the static throttle applied to all motors, on top of
                  which the excitation signal is added.
                  Use a low value (0.1-0.2) sufficient to spin the motors
                  but safe for test bench operation with props removed.
            type: float
            unit: norm
            decimal: 2
            min: 0.05
            max: 0.5
            default: 0.15
